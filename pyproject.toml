[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lite"
version = "0.1.0"
description = "A lightweight Hermes Agent for small local models (llama.cpp), with a Textual TUI"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "httpx>=0.27", "pyyaml>=6", "pillow>=10", "psutil>=5.9; sys_platform != 'linux'"]

[project.scripts]
hermes-lite = "hermes_lite.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes_lite*"]

[tool.setuptools.package-data]
hermes_lite = ["default_config.yaml", "tui/app.tcss", "prompts/*.md", "prompts/compact/*.md", "prompts/compact/*.yaml"]
